name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: Create .env from example (bundled asset; real values are not in git)
        run: cp -n .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code
        run: dart run build_runner build -d

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test
