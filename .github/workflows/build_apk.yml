name: Build APK

# Builds a release APK and attaches it to the run as an artifact.
# Uses the public Supabase URL/anon key by default; secrets SUPABASE_URL and
# SUPABASE_ANON_KEY override them.
# Optional: SENTRY_DSN, and ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD for a properly signed build
# (without them the APK is debug-signed: fine for testing, not for the Play Store).

on:
  workflow_dispatch:
  push:
    branches: [ ccr-40028799-ey1dps ]

jobs:
  # Needs no secrets: proves the code compiles, passes analysis and tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
      - run: cp -n .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      # The Supabase URL and anon key are public by design (they ship inside every
      # copy of the app; access is enforced by RLS), so they are defaults here.
      # Repository secrets of the same name override them.
      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ktgaqyooycmgxmlpuefk.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0Z2FxeW9veWNtZ3htbHB1ZWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDYxNjQsImV4cCI6MjA5NjgyMjE2NH0.SYwe57uNxaH_UW1R5vYcvOVucGmWWigtJdlT7IIRVgE' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "GEMINI_API_KEY="
            echo "BASE_URL=https://api.igoconnection.com"
          } > .env

      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$STORE_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PW"
            } > android/key.properties
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: india-green-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
